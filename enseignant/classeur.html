<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Classeur des élèves · Espace enseignant · LFT</title>
<link rel="stylesheet" href="/css/connecte.css">
</head>
<body>
<header>
  <a class="marque" href="/index.html"><img src="/img/logo-lft.png" alt=""><span><b>Technologie</b><small>Lycée Français de Tananarive</small></span></a>
  <h1>Classeur des élèves</h1>
  <span class="qui" id="qui"></span>
  <a class="lien-tete" href="/enseignant/comptes.html">Groupes et comptes</a>
  <button class="sortir" id="sortir">Fermer ma session</button>
</header>

<main>
  <section>
    <label for="groupe">Groupe</label>
    <select id="groupe"></select>
    <p class="manquants" id="manquants"></p>
  </section>

  <section>
    <h2>Travaux déposés</h2>
    <div id="liste"><p class="vide">Chargement…</p></div>
  </section>

  <section>
    <h2>Redonner un accès à un élève</h2>
    <p class="meta">Pour l'élève qui ne peut plus ouvrir sa boîte de courriel.
       Vous lui dictez un mot de passe provisoire, qu'il doit changer aussitôt.</p>
    <div class="ligne">
      <div>
        <label for="eleve">Élève</label>
        <select id="eleve"></select>
      </div>
      <div>
        <label for="motif">Motif (pour le journal)</label>
        <input id="motif" type="text" maxlength="200"
               placeholder="ex. n'accède plus à sa boîte">
      </div>
      <button class="secondaire" id="reinit">Réinitialiser</button>
    </div>

    <!-- Ressaisie du mot de passe du professeur. Un champ de type password,
         et surtout PAS un prompt() : celui-ci affiche en clair ce qu'on tape,
         sur un écran qui est très souvent projeté au tableau, puisque c'est
         souvent la raison même pour laquelle le professeur s'est connecté.
         Le mot de passe se lirait alors depuis le fond de la salle. -->
    <div class="ligne" id="bloc-confirme" hidden>
      <div>
        <label for="confirme">Votre mot de passe, pour confirmer</label>
        <input id="confirme" type="password" autocomplete="current-password">
      </div>
      <button class="secondaire" id="confirmer">Confirmer</button>
      <button class="secondaire" id="annuler">Annuler</button>
    </div>
    <p class="msg" id="mr" role="status" aria-live="polite"></p>
  </section>
</main>

<script type="module">
import { SEQUENCES } from '/js/sequences.js';
import { api, dateCourte, echapper } from '/js/classeur-commun.js';

const $ = (id) => document.getElementById(id);
const TITRES = Object.fromEntries(
  Object.values(SEQUENCES).flat().map((s) => [s.id, s.titre]));

async function charger() {
  const g = await api('/api/classeur/groupes');
  if (g.role !== 'prof') { location.href = '/classeur/'; return; }
  $('qui').textContent = g.prenom ? `${g.prenom}` : '';
  $('groupe').innerHTML = g.groupes
    .map((x) => `<option value="${x.id}">${echapper(x.code)} — ${echapper(x.libelle)}</option>`)
    .join('');
  if (g.groupes.length) await voirGroupe();
  else $('liste').innerHTML = '<p class="vide">Aucun groupe ne vous est rattaché.</p>';
}

async function voirGroupe() {
  const d = await api('/api/prof/rendus?groupe=' + $('groupe').value);

  // Qui n'a rien rendu ? C'est souvent l'information la plus utile.
  // Comparaison sur l'IDENTIFIANT, jamais sur le nom. Deux homonymes dans un
  // groupe, et le dépôt de l'un couvrait l'absence de l'autre : le professeur
  // lisait « tous les élèves ont déposé » alors que l'un n'avait rien rendu.
  const auteurs = new Set(d.rendus.filter((r) => r.fichier)
    .map((r) => r.profil_id ?? r.profils?.id));
  const absents = d.eleves
    .filter((e) => !auteurs.has(e.id))
    .map((e) => `${e.prenom} ${e.nom}`);
  $('manquants').innerHTML = absents.length
    ? `<b>${absents.length} élève(s) n'ont rien déposé :</b> ${echapper(absents.join(', '))}`
    : `<b>Tous les élèves du groupe ont déposé au moins un travail.</b>`;

  $('eleve').innerHTML = d.eleves
    .map((e) => `<option value="${e.id}">${echapper(e.nom)} ${echapper(e.prenom)}</option>`)
    .join('');

  if (!d.rendus.length) {
    $('liste').innerHTML = '<p class="vide">Aucun dépôt pour ce groupe.</p>';
    return;
  }

  $('liste').innerHTML = d.rendus.map((r) => `
    <article class="rendu ${r.corrige_le ? 'fait' : 'attente'}">
      <h3>${echapper(r.profils?.nom || '')} ${echapper(r.profils?.prenom || '')}</h3>
      <p class="meta">${echapper(TITRES[r.sequence] || r.sequence)} ·
        déposé le ${dateCourte(r.depose_le)}
        ${r.binome ? ' · avec ' + echapper(r.binome) : ''}
        ${!r.fichier ? ' · <b>envoi incomplet</b>' : ''}</p>
      ${r.commentaire ? `<p class="mot">« ${echapper(r.commentaire)} »</p>` : ''}
      ${r.fichier ? `<p class="meta"><a href="#" class="voir"
          data-rendu="${r.id}">Ouvrir le document</a></p>` : ''}
      <div class="ligne">
        <div>
          <label for="a-${r.id}">Correction</label>
          <textarea id="a-${r.id}">${echapper(r.appreciation || '')}</textarea>
        </div>
        <div style="flex:0 0 6rem">
          <label for="n-${r.id}">Note /20</label>
          <input id="n-${r.id}" type="number" min="0" max="20" step="0.5"
                 value="${r.note ?? ''}">
        </div>
        <button class="corriger" data-rendu="${r.id}">Enregistrer</button>
      </div>
      ${r.corrige_le ? `<p class="meta"><button class="lien-sup retirer"
          data-rendu="${r.id}">Retirer la correction</button></p>` : ''}
      ${!r.fichier ? `<p class="meta"><button class="lien-sup vider"
          data-rendu="${r.id}">Supprimer ce dépôt resté vide</button></p>` : ''}
    </article>`).join('');

  document.querySelectorAll('.voir').forEach((a) =>
    a.addEventListener('click', async (e) => {
      e.preventDefault();
      const d = await api('/api/classeur/fichier?rendu=' + a.dataset.rendu);
      window.open(d.url, '_blank', 'noopener');
    }));

  // Un clic par mégarde sur « Enregistrer » posait corrige_le pour toujours :
  // l'élève ne pouvait plus rien redéposer et le professeur n'avait aucun
  // recours. La correction se retire maintenant.
  document.querySelectorAll('.retirer').forEach((b) =>
    b.addEventListener('click', async () => {
      if (!confirm('Retirer la correction ? L’appréciation et la note ' +
                   'seront effacées, et l’élève pourra redéposer.')) return;
      b.disabled = true; b.textContent = '…';
      try {
        await api('/api/prof/corriger', {
          method: 'POST',
          body: JSON.stringify({ rendu: b.dataset.rendu, annuler: true }),
        });
        await voirGroupe();
      } catch (e) {
        alert(e.message); b.disabled = false; b.textContent = 'Retirer la correction';
      }
    }));

  // Les dépôts restés vides après un envoi interrompu : le professeur fait le
  // ménage. Il ne peut supprimer QUE ceux-là, jamais un travail déposé.
  document.querySelectorAll('.vider').forEach((b) =>
    b.addEventListener('click', async () => {
      b.disabled = true; b.textContent = '…';
      try {
        await api('/api/classeur/supprimer-depot', {
          method: 'POST', body: JSON.stringify({ rendu: b.dataset.rendu }),
        });
        await voirGroupe();
      } catch (e) {
        alert(e.message); b.disabled = false;
        b.textContent = 'Supprimer ce dépôt resté vide';
      }
    }));

  document.querySelectorAll('.corriger').forEach((b) =>
    b.addEventListener('click', async () => {
      const id = b.dataset.rendu;
      b.disabled = true; b.textContent = '…';
      try {
        await api('/api/prof/corriger', {
          method: 'POST',
          body: JSON.stringify({
            rendu: id,
            appreciation: $('a-' + id).value,
            note: $('n-' + id).value,
          }),
        });
        b.textContent = 'Enregistré';
        setTimeout(voirGroupe, 800);
      } catch (e) {
        b.textContent = 'Échec'; b.disabled = false;
        alert(e.message);
      }
    }));
}

$('groupe').addEventListener('change', voirGroupe);

$('sortir').addEventListener('click', async () => {
  try {
    const r = await fetch('/api/auth/deconnexion', { method: 'POST' });
    if (!r.ok) throw new Error('refus');
    location.href = '/';
  } catch (e) {
    // Ne pas partir vers l'accueil comme si c'était fait : la session serait
    // toujours vivante et le professeur croirait être sorti.
    alert('La session n’a PAS été fermée : le réseau ou le service n’a pas ' +
          'répondu. Fermez complètement le navigateur, la session meurt avec lui.');
  }
});

// Ressaisie du mot de passe, et non une simple confirmation. Un « OK » se
// clique : si une session professeur reste ouverte sur un poste de salle
// informatique, l'élève suivant s'en servirait pour fabriquer le mot de
// passe d'un camarade, et le journal accuserait le professeur, puisque le
// contrôle d'appartenance au groupe passerait. Le mot de passe, lui, il ne
// l'a pas.
function fermerConfirmation() {
  $('bloc-confirme').hidden = true;
  $('confirme').value = '';
  $('reinit').disabled = false;
}

$('reinit').addEventListener('click', () => {
  if (!$('eleve').value) {
    $('mr').className = 'msg err';
    $('mr').textContent = 'Choisissez d’abord un élève.';
    return;
  }
  const nom = $('eleve').selectedOptions[0]?.textContent || 'cet élève';
  $('mr').className = 'msg attention';
  $('mr').textContent =
    `Réinitialiser l’accès de ${nom}. Un mot de passe provisoire s’affichera ` +
    `à l’écran et devra être dit à voix haute. Il ne servira que 24 heures. ` +
    `L’opération est journalisée et signalée à l’élève.`;
  $('bloc-confirme').hidden = false;
  $('reinit').disabled = true;
  $('confirme').focus();
});

$('annuler').addEventListener('click', fermerConfirmation);
$('confirme').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); $('confirmer').click(); }
});

$('confirmer').addEventListener('click', async () => {
  const motDePasse = $('confirme').value;
  if (!motDePasse) { $('confirme').focus(); return; }

  $('confirmer').disabled = true;
  try {
    const d = await api('/api/prof/reinitialiser-eleve', {
      method: 'POST',
      body: JSON.stringify({
        eleve: $('eleve').value, motif: $('motif').value, confirmation: motDePasse,
      }),
    });
    $('mr').className = 'msg attention';
    $('mr').innerHTML =
      `Accès de <b>${echapper(d.eleve)}</b> réinitialisé.<br>` +
      `<span class="mdp">${echapper(d.motDePasse)}</span><br>` +
      `<small>${echapper(d.avertissement)}</small>`;
    $('motif').value = '';
    fermerConfirmation();
  } catch (e) {
    $('mr').className = 'msg err'; $('mr').textContent = e.message;
    $('confirme').value = '';
    $('confirme').focus();
  } finally {
    $('confirmer').disabled = false;
  }
});

charger().catch((e) => { $('liste').innerHTML =
  `<p class="msg err" style="display:block">${echapper(e.message)}</p>`; });
</script>
</body>
</html>
