<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mot de passe oublié · Technologie · LFT</title>
<style>
  :root{ --cyan:#0096c8; --orange:#d67c1c; --encre:#323232; --gris:#6b7280; }
  *{ box-sizing:border-box }
  body{ margin:0; min-height:100vh; display:flex; align-items:center;
        justify-content:center; padding:1.5rem; background:#f4f7f9;
        color:var(--encre); font:16px/1.6 Roboto,system-ui,sans-serif }
  main{ width:100%; max-width:26rem; background:#fff; border-radius:12px;
        padding:2rem; box-shadow:0 1px 3px rgba(0,0,0,.08) }
  h1{ font:600 1.5rem/1.3 Raleway,system-ui,sans-serif; color:var(--cyan);
      margin:0 0 .25rem }
  .sous{ color:var(--gris); font-size:.9rem; margin:0 0 1.75rem }
  label{ display:block; font-weight:500; margin:1rem 0 .35rem }
  input{ width:100%; padding:.7rem .8rem; border:1px solid #d1d5db;
         border-radius:8px; font-size:1rem; font-family:inherit }
  input:focus{ outline:2px solid var(--cyan); outline-offset:1px;
               border-color:var(--cyan) }
  button{ width:100%; margin-top:1.5rem; padding:.8rem; border:0;
          border-radius:8px; background:var(--cyan); color:#fff;
          font:500 1rem Raleway,system-ui,sans-serif; cursor:pointer }
  button:hover{ background:#007ba6 }
  button[disabled]{ opacity:.6; cursor:progress }
  .oubli{ display:block; margin-top:1.25rem; text-align:center;
          color:var(--cyan); font-size:.9rem }
  .msg{ margin-top:1.25rem; padding:.8rem 1rem; border-radius:8px;
        font-size:.9rem; display:none }
  .msg.err{ display:block; background:#fef2f2; border-left:3px solid #dc2626 }
  .msg.ok{ display:block; background:#f0fdf4; border-left:3px solid #16a34a }
  .avert{ margin-top:1.75rem; padding-top:1.25rem; border-top:1px solid #e5e7eb;
          font-size:.82rem; color:var(--gris) }
  .avert strong{ color:var(--orange) }
  .retour{ display:block; margin-top:1rem; text-align:center;
           font-size:.85rem; color:var(--gris) }
</style>
</head>
<body>
<main>
  <h1>Première connexion</h1>
  <p class="sous">…ou mot de passe oublié. C'est la même démarche.</p>

  <form id="f" novalidate>
    <label for="email">Votre adresse de l'établissement</label>
    <input id="email" type="email" required autocomplete="username"
           autocapitalize="none" spellcheck="false"
           placeholder="prenom.nom@eleve.egd.mg">
    <button type="submit" id="b">Recevoir un message</button>
  </form>

  <p class="msg" id="m" role="status" aria-live="polite"></p>

  <p class="avert">
    <strong>Vous n'arrivez pas à ouvrir votre boîte&nbsp;?</strong>
    C'est fréquent en début d'année. Demandez à votre professeur de
    Technologie&nbsp;: il peut vous donner un accès provisoire en séance,
    sans passer par le courriel.
  </p>

  <a class="retour" href="/connexion.html">← Retour à la connexion</a>
</main>

<script>
(function () {
  var f = document.getElementById('f'), b = document.getElementById('b'),
      m = document.getElementById('m');
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    b.disabled = true; b.textContent = 'Envoi…';
    fetch('/api/auth/mot-de-passe-oublie', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value })
    })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      m.textContent = d.message; m.className = 'msg ok';
      b.textContent = 'Message envoyé';
    })
    .catch(function () {
      m.textContent = 'Le réseau ne répond pas. Réessayez.';
      m.className = 'msg err'; b.disabled = false;
      b.textContent = 'Recevoir un message';
    });
  });
})();
</script>
</body>
</html>
